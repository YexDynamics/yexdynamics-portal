version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: portal_indie_db
    restart: always
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: